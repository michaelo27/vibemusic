<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VibeMusic — interactive prototype</title>
<style>
/* ── design tokens ───────────────────────────────────────────────────────── */
:root{
  color-scheme:light;
  --bg:#ffffff; --bg-2:#f6f7f9; --bg-3:#f1f2f5;
  --surface:#ffffff; --line:#e7e9ee; --line-2:#d6dae1;
  --text:#0d1014; --muted:#5b6472; --faint:#8a929d;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#eef0fe; --accent-line:#d8dbfb;
  --good:#047857; --good-soft:#e8f6ef;
  --warn:#9a5b06; --warn-soft:#fdf4e5;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(13,16,20,.04),0 12px 32px -18px rgba(13,16,20,.25);
  --mono:ui-monospace,SFMono-Regular,Menlo,"Roboto Mono",monospace;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0b0d; --bg-2:#101216; --bg-3:#15181e;
  --surface:#111318; --line:#23262e; --line-2:#31353f;
  --text:#f2f4f7; --muted:#a1a9b5; --faint:#6e7681;
  --accent:#9188ff; --accent-ink:#12111c; --accent-soft:#1a1927; --accent-line:#2d2b47;
  --good:#42d6a3; --good-soft:#0f231c;
  --warn:#eab464; --warn-soft:#241c10;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 40px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  transition:background .18s ease,color .18s ease;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol{margin:0}
.mono{font-family:var(--mono);font-size:.92em}
.shell{max-width:1080px;margin:0 auto;padding:0 24px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── header ─────────────────────────────────────────────────────────────── */
.hdr{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr.blur{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px)}
.hrow{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:9px;font-weight:660;font-size:15.5px;letter-spacing:-.015em}
.brand .mark{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:13px;flex:none}
.badge{font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.nav{display:flex;gap:2px;margin-left:10px;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.lbl-min{display:none}
.nav a{padding:7px 12px;border-radius:9px;font-size:13.5px;color:var(--muted);font-weight:520}
.nav a:hover{color:var(--text);background:var(--bg-2)}
.nav a.on{color:var(--text);background:var(--bg-2)}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;font-size:14px;line-height:1}
.iconbtn:hover{color:var(--text);border-color:var(--line-2)}
.balchip{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
@media(max-width:680px){
  /* the wordmark got longer, so the nav drops to its own row instead of scrolling off-screen */
  .badge{display:none}
  .hrow{flex-wrap:wrap;height:auto;padding:9px 0 8px;row-gap:8px;gap:8px}
  .brand{order:1;font-size:14.5px;gap:7px}
  .brand .mark{width:24px;height:24px}
  .hright{order:2;gap:6px}
  .nav{order:3;width:100%;margin:0;gap:2px;overflow:visible;padding:3px;
    background:var(--bg-2);border:1px solid var(--line);border-radius:11px}
  .nav a{flex:1;text-align:center;padding:7px 0;font-size:12.8px;border-radius:8px}
  .nav a.on{background:var(--surface);box-shadow:0 1px 2px rgba(13,16,20,.07)}
  .balchip{display:none}
  .lbl-full{display:none}
  .lbl-min{display:inline}
}

/* ── primitives ─────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:40px;padding:0 16px;border-radius:var(--radius-sm);
  border:1px solid var(--line-2);background:var(--surface);color:var(--text);
  font-size:14px;font-weight:550;cursor:pointer;white-space:nowrap;
  transition:background .14s,border-color .14s,filter .14s;
}
.btn:hover{background:var(--bg-2)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--bg-2);color:var(--text)}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:9px}
.btn.lg{height:46px;font-size:15px;border-radius:12px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .dot{width:6px;height:6px;border-radius:50%;background:var(--good);flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.card.tight{padding:0}
.stack>*+*{margin-top:16px}
.i{
  width:100%;height:42px;border-radius:var(--radius-sm);border:1px solid var(--line-2);
  background:var(--surface);color:var(--text);padding:0 13px;font-size:14px;outline:none;
  transition:border-color .14s,box-shadow .14s;
}
.i::placeholder{color:var(--faint)}
.i:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.i{height:auto;min-height:86px;padding:11px 13px;resize:vertical;line-height:1.55;font-family:inherit}
.label{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:550;color:var(--muted);margin-bottom:6px}
.label span{font-weight:400;color:var(--faint);font-size:11.5px}
.field+.field{margin-top:14px}
.divider{height:1px;background:var(--line);border:0;margin:20px 0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip.good{color:var(--good);border-color:transparent;background:var(--good-soft)}
.chip.accent{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.dotg{width:5px;height:5px;border-radius:50%;background:var(--good);display:inline-block}
.empty{padding:26px 20px;text-align:center;color:var(--faint);font-size:13px;line-height:1.6}
.empty b{display:block;color:var(--muted);font-weight:560;margin-bottom:4px;font-size:13.5px}

/* ── hero / sections ────────────────────────────────────────────────────── */
.hero{padding:76px 0 40px;max-width:740px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.075em;text-transform:uppercase;color:var(--faint);margin-bottom:16px}
h1{font-size:clamp(30px,4.3vw,46px);line-height:1.06;letter-spacing:-.03em;font-weight:670}
.lede{font-size:16.5px;color:var(--muted);max-width:62ch;margin-top:18px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.facts{display:flex;gap:20px;flex-wrap:wrap;list-style:none;padding:0;margin-top:28px;font-size:12.5px;color:var(--faint)}
.facts li{display:flex;align-items:center;gap:7px}
.facts li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--good);flex:none}

.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:64px}
.stat{padding:24px 0}
.stat+.stat{border-left:1px solid var(--line);padding-left:26px}
.stat b{display:block;font-size:24px;font-weight:640;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--faint)}
@media(max-width:720px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(odd){border-left:0;padding-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
}

.block{margin-bottom:64px}
.block:last-child{margin-bottom:40px}
.bhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.bhead h2{font-size:20px;font-weight:640;letter-spacing:-.02em}
.bhead p{color:var(--muted);font-size:13.5px;max-width:62ch;margin-top:5px}
.bhead .side{display:flex;gap:8px;align-items:center}

/* ── mission runner ─────────────────────────────────────────────────────── */
.runrow{display:flex;gap:10px}
.runrow .i{flex:1;min-width:0}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.preset{font-size:12.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:.14s}
.preset:hover{border-color:var(--line-2);color:var(--text)}
.preset.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;list-style:none;padding:0;margin-top:22px}
.step{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);transition:.16s}
.sdot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;border:1px solid var(--line-2);color:var(--faint);background:var(--surface)}
.sl{font-size:12px;font-weight:540;color:var(--muted)}
.step.active{border-color:var(--accent-line);background:var(--accent-soft)}
.step.active .sdot{border-color:transparent;background:var(--accent);color:var(--accent-ink)}
.step.active .sl{color:var(--accent)}
.step.done .sdot{border-color:transparent;background:var(--good-soft);color:var(--good)}
.step.done .sl{color:var(--text)}
@media(max-width:660px){
  .steps{grid-template-columns:repeat(2,1fr)}
  .step:nth-child(5){grid-column:1/-1;flex-direction:row;align-items:center}
  .runrow{flex-direction:column}
}
.phasehint{margin-top:14px;font-size:12.5px;color:var(--faint);min-height:19px}
#receipts{margin-top:6px}
.receipt{padding:14px 0;border-top:1px solid var(--line)}
.receipt:first-child{border-top:0;padding-top:6px}
.rrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rtitle{font-size:13.5px;font-weight:560}
.rhandle{color:var(--faint);font-weight:400;font-size:12.5px;margin-left:8px}
.amt{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--good);white-space:nowrap}
.why{margin-top:4px;font-size:12.5px;color:var(--muted);line-height:1.55}

/* ── landing hero + animated pass ──────────────────────────────────────── */
.hero2{text-align:center;padding:46px 0 26px}
.hero2 h1{max-width:23ch;margin:0 auto;font-size:clamp(31px,4.6vw,50px);text-wrap:balance}
.hero2 .lede{margin:18px auto 0;max-width:60ch;font-size:15.8px}
.hero2 .cta{justify-content:center;margin-top:26px}
.hero2 .facts{margin-top:46px}
.stagewrap{position:relative;margin-top:38px;display:flex;flex-direction:column;align-items:center;overflow:clip}
.stage{position:relative;width:min(404px,82vw);perspective:1500px;isolation:isolate}
.stage::before{content:"";position:absolute;inset:-14% -24% -20%;z-index:-1;filter:blur(16px);
  background:radial-gradient(58% 52% at 50% 46%,rgba(99,91,255,.19),transparent 72%)}
html[data-theme="dark"] .stage::before{background:radial-gradient(58% 52% at 50% 46%,rgba(145,136,255,.3),transparent 72%)}
.pass-wrap{animation:floaty 9s ease-in-out infinite;transform-style:preserve-3d}
@keyframes floaty{0%,100%{transform:translate3d(0,-7px,0) rotate(-1.4deg)}50%{transform:translate3d(0,9px,0) rotate(1.4deg)}}
.pass{display:block;position:relative;aspect-ratio:360/486;border-radius:30px;overflow:hidden;color:#f3f4f7;text-decoration:none;
  background:radial-gradient(130% 90% at 50% -10%,#1b1e26 0%,#0c0e12 52%,#07080a 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 1px rgba(255,255,255,.06),0 44px 70px -34px rgba(15,18,30,.5);
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .16s ease-out;will-change:transform}
.pass:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
.pass::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 12px/100% 27px,
             linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/27px 100%;
  -webkit-mask-image:radial-gradient(118% 82% at 50% 12%,#000 20%,transparent 74%);
  mask-image:radial-gradient(118% 82% at 50% 12%,#000 20%,transparent 74%)}
.pass::after{content:"";position:absolute;inset:-30%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.2),rgba(255,255,255,0) 46%)}
.pass-in{position:relative;z-index:2;height:100%;padding:20px 22px 18px;display:flex;flex-direction:column}
.pass-notch{width:64px;height:8px;border-radius:99px;margin:0 auto 18px;background:rgba(255,255,255,.1);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.07)}
.pass-top{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.17em;
  color:rgba(255,255,255,.48);text-transform:uppercase}
.pass-sigil{position:absolute;top:54px;left:50%;transform:translateX(-44%);width:260px;color:rgba(255,255,255,.15);pointer-events:none}
.pass-brand{position:relative;margin:30px 0 0;font-size:clamp(34px,8.6vw,45px);font-weight:700;letter-spacing:-.045em;line-height:.92;
  background:linear-gradient(180deg,#fff 6%,#cfccff 58%,#8f88ff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.pass-id{display:flex;align-items:center;gap:14px;margin-top:32px;min-width:0}
.pass-name{font-size:20px;font-weight:640;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pass-meta{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:10.5px;
  color:rgba(255,255,255,.45);min-width:0}
.pass-meta em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pass-meta .pill{font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;border:1px solid rgba(255,255,255,.24);
  border-radius:99px;padding:2px 8px;color:#fff;flex:none}
.pass-medal{position:relative;width:54px;height:54px;border-radius:50%;flex:none;margin-left:auto;display:grid;place-items:center}
.pass-medal::before{content:"";position:absolute;inset:0;border-radius:50%;opacity:.85;
  background:conic-gradient(from 0deg,#8f88ff,#42d6a3,#ffd479,#ff9ec7,#8f88ff);animation:spin 9s linear infinite}
.pass-medal::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#0b0d11}
.pass-medal span{position:relative;z-index:2;font-size:12.5px;font-weight:700;letter-spacing:.04em}
@keyframes spin{to{transform:rotate(360deg)}}
.pass-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:30px;padding-top:17px;
  border-top:1px solid rgba(255,255,255,.09)}
.pass-grid .k{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.38)}
.pass-grid .v{font-size:12px;font-weight:560;margin-top:5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pass-grid .v.ok{color:#5ce0b0}
.pass-wave{display:flex;align-items:flex-end;gap:3px;height:38px;margin-top:26px;opacity:.9}
.pass-wave i{display:block;width:3px;border-radius:2px;height:var(--h,10px);transform-origin:bottom;
  background:linear-gradient(180deg,#a49dff,#42d6a3);animation:pump 1.7s ease-in-out infinite alternate}
@keyframes pump{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
.pass-last{display:flex;justify-content:space-between;align-items:baseline;margin-top:13px;font-size:10.5px;
  letter-spacing:.04em;color:rgba(255,255,255,.42)}
.pass-last b{color:#fff;font-weight:560}
.pass-stub{margin-top:auto;padding-top:15px;border-top:1px dashed rgba(255,255,255,.16)}
.pass-bars{display:flex;align-items:flex-end;gap:2px;height:44px}
.pass-bars i{display:block;background:#fff;height:100%;border-radius:.5px;opacity:.92}
.pass-stubrow{display:flex;justify-content:space-between;margin-top:9px;font-size:9px;letter-spacing:.15em;
  color:rgba(255,255,255,.45);text-transform:uppercase}
.pass-shadow{position:absolute;left:50%;bottom:-24px;width:74%;height:22px;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(12,15,25,.3),transparent);filter:blur(5px);z-index:-1}
html[data-theme="dark"] .pass-shadow{background:radial-gradient(closest-side,rgba(0,0,0,.75),transparent)}
.only-desktop{display:none}
@media(min-width:721px){.only-desktop{display:inline}}
.stage-hint{margin-top:30px;font-size:12.5px;color:var(--faint);text-align:center}
.stage-hint a{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.stage-hint a:hover{color:var(--text)}
@media (prefers-reduced-motion:reduce){
  .pass-wrap{animation:none}.pass-medal::before{animation:none}.pass{transition:none}
}

/* ── jar cards ──────────────────────────────────────────────────────────── */
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.jcard{display:block;border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--surface);transition:.16s}
.jcard:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--shadow)}
.jtop{display:flex;align-items:center;gap:12px;min-width:0}
.av{width:44px;height:44px;border-radius:50%;flex:none;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.jname{font-size:14px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jhandle{font-size:12.5px;color:var(--faint)}
.jbio{margin-top:13px;font-size:12.8px;color:var(--muted);line-height:1.55;min-height:40px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
.jfoot .sum{color:var(--text);font-weight:550;font-variant-numeric:tabular-nums}

/* ── jar page ───────────────────────────────────────────────────────────── */
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:28px 0 22px}
.back:hover{color:var(--text)}
.profile{display:flex;align-items:center;gap:18px;margin-bottom:28px;flex-wrap:wrap}
.profile .av{width:70px;height:70px}
.profile h1{font-size:26px;letter-spacing:-.025em}
.pmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12.5px;color:var(--faint)}
.jcols{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.jcols .side{position:sticky;top:84px}
@media(max-width:880px){.jcols{grid-template-columns:1fr}.jcols .side{position:static;order:-1}}
.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.amounts+.field{margin-top:16px}
.amtbtn{height:40px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:560;cursor:pointer;transition:.14s;font-variant-numeric:tabular-nums}
.amtbtn:hover{border-color:var(--line-2)}
.amtbtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tipstate{margin-top:12px;font-size:12.5px;color:var(--faint);min-height:18px;line-height:1.5}
.tipstate.ok{color:var(--good)}
.tipstate.busy{color:var(--accent)}
.tnote{margin-top:14px;font-size:11.5px;color:var(--faint);line-height:1.6}
.trow{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0;padding-top:2px}

/* ── agent brain (mirrors shared/scoring.ts) ────────────────────────────── */
const GENRES = {
  chill: ['Lo-Fi', 'Ambient', 'Downtempo', 'R&B/Soul', 'Jazz'], lofi: ['Lo-Fi', 'Ambient'],
  electronic: ['Electronic', 'House', 'Techno', 'Tech House', 'Dubstep', 'Drum & Bass'],
  house: ['House', 'Tech House'], bass: ['Dubstep', 'Electronic'], dubstep: ['Dubstep'],
  'lo-fi': ['Lo-Fi', 'Ambient'], ambient: ['Ambient', 'Experimental'], pop: ['Pop', 'R&B/Soul'],
  soul: ['R&B/Soul', 'Funk'], funk: ['Funk'], indie: ['Pop', 'Alternative'], afrobeats: ['Afrobeats', 'Dancehall'],
};
const MOODS = {
  chill: ['Peaceful', 'Calm', 'Cool', 'Mellow'], calm: ['Peaceful', 'Calm'],
  energetic: ['Fiery', 'Aggressive', 'Defiant'], dark: ['Brooding', 'Gritty'],
  happy: ['Upbeat', 'Romantic', 'Sensual'], study: ['Peaceful', 'Calm'],
};
function parseIntent(prompt) {
  const lower = String(prompt).toLowerCase();
  const words = lower.replace(/[^a-z0-9\s-]/g, ' ').split(/\s+/).filter(Boolean);
  const genres = [...new Set(words.flatMap(w => GENRES[w] || []))];
  const moods = [...new Set(words.flatMap(w => MOODS[w] || []))];
  const wantsFresh = /\b(fresh|new|recent|latest|drop)\b/.test(lower);
  const wantsUnderrated = /\b(underrated|hidden|undiscovered|under|5k)\b/.test(lower);
  const bits = [];
  if (genres.length) bits.push('genres ' + genres.slice(0, 3).join(' / '));
  if (moods.length) bits.push('moods ' + moods.slice(0, 3).join(' / '));
  if (wantsFresh) bits.push('freshness weighted');
  if (wantsUnderrated) bits.push('underrated boost');
  return { prompt, genres, moods, wantsFresh, wantsUnderrated, brief: bits.join(' · ') || 'open brief — pure quality score' };
}
function scoreTrack(t, intent) {
  const sig = [];
  const base = intent.genres.length || intent.moods.length ? 22 : 30;
  if (intent.genres.length) {
    if (intent.genres.some(g => t.genre.toLowerCase().includes(g.toLowerCase()))) sig.push({ p: 24, note: t.genre + ' fits your brief' });
    else sig.push({ p: -10, note: t.genre + ' is off-brief' });
  } else sig.push({ p: 6, note: 'tagged ' + t.genre });
  if (intent.moods.length) {
    if (intent.moods.some(m => t.mood.toLowerCase().includes(m.toLowerCase()))) sig.push({ p: 14, note: t.mood + ' mood match' });
  } else sig.push({ p: 5, note: t.mood + ' mood' });
  sig.push({ p: Math.min(14, Math.round(Math.log10(t.plays + 1) * 3.4)), note: fmt(t.plays) + ' plays' });
  const likeRate = t.plays > 20 ? t.favs / t.plays : 0;
  if (likeRate >= 0.02) sig.push({ p: 6, note: 'strong like-rate (' + (likeRate * 100).toFixed(1) + '%)' });
  else if (t.favs >= 25) sig.push({ p: 3, note: fmt(t.favs) + ' likes' });
  if (t.days <= 14) sig.push({ p: intent.wantsFresh ? 10 : 8, note: 'fresh drop (' + t.days + ' days ago)' });
  else if (t.days <= 30) sig.push({ p: 6, note: 'recent (' + t.days + ' days ago)' });
  if (intent.wantsUnderrated && t.plays < 5000 && t.favs >= 15) sig.push({ p: 10, note: 'hidden gem — only ' + fmt(t.plays) + ' plays' });
  const craft = 2 + (t.desc.length > 40 ? 2 : 0) + (t.dur >= 60 && t.dur <= 600 ? 3 : 0);
  sig.push({ p: craft, note: craft >= 6 ? 'well-produced drop (art, notes, tight runtime)' : 'decent metadata' });
  if (t.dur > 1200) sig.push({ p: -8, note: 'long runtime' });
  const score = Math.max(0, Math.min(100, Math.round(base + sig.reduce((s, x) => s + x.p, 0))));
  const positives = sig.filter(s => s.p > 0).sort((a, b) => b.p - a.p).slice(0, 3).map(s => s.note);
  return { track: t, score, reason: positives.join(' · ') + ' — ' + score + '/100' };
}
const amountFor = score => (score >= 88 ? 25 : score >= 80 ? 18 : score >= 72 ? 12 : 8);

async function runMission(prompt) {
  if (running) return;
  running = true;
  S.ui.prompt = prompt;
  const intent = parseIntent(prompt);

  const scored = CATALOGUE.map(t => scoreTrack(t, intent)).sort((a, b) => b.score - a.score);
  const qualifying = scored.filter(s => s.score >= 68);
  const withJar = qualifying.filter(s => jarForHandle(s.track.handle));
  const selection = (withJar.length ? withJar : qualifying).slice(0, 2);

  const steps = [];
  const mission = { id: uid('m'), prompt, considered: CATALOGUE.length, selected: selection.length, tipped: 0, skipped: CATALOGUE.length - selection.length, total: 0, at: now(), steps };

  if (route.name !== 'home' && route.name !== 'agent') { go('#/'); await sleep(140); }
  if (route.name === 'create') { go('#/'); await sleep(140); }
  render();
  await sleep(80);

  const stepEls = $$('#steps .step');
  const receiptBox = $('#receipts');
  const stateEl = $('#paneState');
  const hintEl = $('#phaseHint');
  const btn = $('[data-act="run-mission"]');

  steps.push({ stage: 'discover', text: `Scanning Audius for “${prompt}”`, detail: 'intent: ' + intent.brief });
  steps.push({ stage: 'evaluate', text: `Scored ${CATALOGUE.length} tracks · ${qualifying.length} cleared 68/100`, detail: scored.slice(0, 3).map(s => `${s.track.title.slice(0, 24)} (${s.score})`).join(' · ') });

  if (stateEl) stateEl.textContent = 'running';
  if (btn) { btn.disabled = true; btn.textContent = 'Agent is working…'; }
  if (receiptBox) receiptBox.innerHTML = `<div class="empty"><b>Agent is working</b>Reading Audius metadata, scoring tracks and signing authorizations. On-chain settlement takes a few seconds per tip.</div>`;

  for (let i = 0; i < PHASES.length; i++) {
    const el = stepEls[i];
    if (el) { el.className = 'step active'; el.querySelector('.sdot').textContent = '◌'; }
    if (hintEl) hintEl.textContent = `${PHASES[i][0]} — ${PHASES[i][1]}`;
    await sleep(720);
    if (el) { el.className = 'step done'; el.querySelector('.sdot').textContent = '✓'; }
  }
  if (hintEl) hintEl.textContent = 'Settling tips on Base…';
  if (receiptBox) receiptBox.innerHTML = '';
  if (stateEl) stateEl.textContent = 'settling';

  for (const s of selection) {
    await sleep(300);
    const jar = jarForHandle(s.track.handle);
    const amount = amountFor(s.score);
    const tx = fakeTx();
    if (!jar) {
      steps.push({ stage: 'skip', text: `Skipped @${s.track.handle} — no VibeMusic jar linked`, detail: `“${s.track.title}” scored ${s.score}/100 but has no wallet to pay` });
      continue;
    }
    steps.push({ stage: 'sign', text: `Signing EIP-712 authorization for “${s.track.title}”`, detail: `no gas, no ETH — ${amount} $VIBES authorized to @${jar.slug}` });
    steps.push({ stage: 'relay', text: `Tipped @${jar.slug} ${amount} $VIBES for “${s.track.title}”`, detail: s.reason, tx, amount });

    S.tips.unshift({ id: uid('tip'), from: S.agent.address, to: jar.wallet, amount, agent: true, reason: s.reason, trackTitle: s.track.title, ts: now(), tx });
    jar.total = Number(jar.total || 0) + amount;
    jar.tipCount = Number(jar.tipCount || 0) + 1;
    S.agent.vibes -= amount;
    mission.tipped += 1;
    mission.total += amount;

    if (receiptBox) {
      const div = document.createElement('div');
      div.className = 'receipt';
      div.innerHTML = `<div class="rrow">
          <div class="rtitle">${esc(s.track.title)}<span class="rhandle">@${esc(jar.slug)}</span></div>
          <span class="amt">+${amount} VIBES</span>
        </div>
        <p class="why">${esc(s.reason)}</p>`;
      receiptBox.appendChild(div);
    }
    await sleep(420);
  }

  if (!selection.length) {
    steps.push({ stage: 'done', text: 'Nothing cleared the quality bar — the agent keeps its $VIBES', detail: `top score ${scored[0].score}/100` });
  } else {
    steps.push({ stage: 'done', text: `Mission complete · ${mission.tipped} tip${mission.tipped === 1 ? '' : 's'} · ${mission.total} $VIBES`, detail: 'gas sponsored by the relayer — the agent holds $VIBES only' });
  }

  S.missions.unshift(mission);
  S.missions = S.missions.slice(0, 12);
  persist();
  running = false;
  render();
  toast(mission.tipped ? `Agent tipped ${mission.tipped} artist${mission.tipped === 1 ? '' : 's'}` : 'Mission finished with no tips',
    mission.tipped ? `${mission.total} $VIBES · gas sponsored by the relayer` : 'Nothing cleared the 68/100 bar this time.',
    mission.tipped ? 'ok' : '');
}

  ck('ckName', d.name.trim());

function paintChrome() {
  $('#walletArea').innerHTML = walletArea();
  const name = route.name === 'jar' ? 'home' : route.name;
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.nav === name));
}
function render() {
  route = readRoute();
  const key = route.name + ':' + (route.id || '');
  const app = $('#app');
  app.innerHTML =
    route.name === 'jar' ? viewJar(route.id) :
    route.name === 'agent' ? viewAgent() :
    route.name === 'create' ? viewCreate() : viewHome();
  paintChrome();
  if (document.getElementById('passCard')) startTilt();
  if (key !== routeKey) {
    routeKey = key;
    try { window.scrollTo({ top: 0 }); } catch {}
  }
}

/* ── events ─────────────────────────────────────────────────────────────── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) {
    if (S.ui.acctOpen && !e.target.closest('.acct')) { S.ui.acctOpen = false; paintChrome(); }
    return;
  }
  const act = t.dataset.act;

  if (act === 'close-modal') {
    if (t.classList.contains('modal-bg') && e.target.closest('.modal')) return;
    closeModal(); return;
  }
  if (act === 'theme') { applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); return; }
  if (act === 'connect') { e.preventDefault(); return openWalletModal(); }
  if (act === 'pick-wallet') { e.preventDefault(); return pickWallet(t.dataset.kind); }
  if (act === 'toggle-acct') { e.preventDefault(); S.ui.acctOpen = !S.ui.acctOpen; return paintChrome(); }
  if (act === 'copy-addr') {
    try { navigator.clipboard && navigator.clipboard.writeText(S.wallet); } catch {}
    toast('Address copied', short(S.wallet, 6), 'ok');
    S.ui.acctOpen = false; return paintChrome();
  }
  if (act === 'view-basescan') { window.open('https://basescan.org/address/' + S.wallet, '_blank', 'noopener'); return; }
  if (act === 'disconnect') { e.preventDefault(); return disconnect(); }
  if (act === 'open-jar') { return; }
  if (act === 'theme-noop') { return; }

  if (act === 'preset') {
    S.ui.prompt = t.dataset.prompt; persist();
    return render();
  }
  if (act === 'run-mission') {
    const inp = $('#promptInput');
    const text = ((inp ? inp.value : S.ui.prompt) || '').trim();
    if (!text) { toast('Give the agent a mission', 'Pick a preset or type what it should reward.', 'err'); return; }
    S.ui.prompt = text; persist();
    return runMission(text);
  }
  if (act === 'toggle-mission') {
    const id = t.dataset.id;
    S.ui.openMission = S.ui.openMission === id ? null : id;
    persist(); return render();
  }
  if (act === 'reset') {
    S = seed(); persist(); go('#/'); render();
    return toast('Demo reset', 'Back to the seeded jars and missions.');
  }

  if (act === 'amount') { S.ui.amount = t.dataset.amt; S.ui.custom = ''; S.ui.tipPhase = 'idle'; persist(); return render(); }
  if (act === 'tip') {
    const jar = S.jars.find(j => j.wallet === t.dataset.wallet);
    if (jar) return sendTip(jar);
    return;
  }
  if (act === 'add-track') {
    const d = ensureDraft();
    if (d.trackIds.length >= 3) { toast('Three tracks max', 'Keep the jar focused.', 'err'); return; }
    const typed = t.dataset.id || ($('#trackInput') ? $('#trackInput').value : '').trim();
    if (!typed) { toast('Paste a track first', '', 'err'); return; }
    const found = CATALOGUE.find(x => x.id.toLowerCase() === typed.toLowerCase() || x.id === typed)
      || CATALOGUE.find(x => typed.includes(x.id))
      || CATALOGUE.find(x => x.title.toLowerCase().includes(typed.toLowerCase()) || x.handle.toLowerCase() === typed.toLowerCase().replace(/^@/, ''));
    if (!found) { toast('Track not found', 'In the shipped app this hits the Audius search API.', 'err'); return; }
    if (d.trackIds.includes(found.id)) { toast('Already linked', found.title, 'err'); return; }
    d.trackIds.push(found.id);
    persist(); render();
    toast('Track linked', found.title, 'ok');
    return;
  }
  if (act === 'remove-track') {
    const d = ensureDraft();
    d.trackIds = d.trackIds.filter(x => x !== t.dataset.id);
    persist(); render(); return;
  }
  if (act === 'publish') { e.preventDefault(); return publishJar(); }
});

document.addEventListener('input', e => {
  const el = e.target.closest('[data-model]');
  if (!el) return;
  const path = el.dataset.model;
  const val = el.value;
  if (path.startsWith('draft.')) {
    ensureDraft()[path.slice(6)] = val;
    if (path === 'draft.slug') S.ui.slugTouched = true;
    if (path === 'draft.name' && !S.ui.slugTouched) {
      ensureDraft().slug = slugify(val);
      const sl = document.querySelector('[data-model="draft.slug"]');
      if (sl) sl.value = ensureDraft().slug;
    }
    refreshDraftUI();
  }
  else if (path === 'custom') { S.ui.custom = val.replace(/[^\d.]/g, ''); if (S.ui.custom !== val) el.value = S.ui.custom; S.ui.tipPhase = 'idle'; }
  else if (path === 'message') { S.ui.message = val.slice(0, 180); }
  else if (path === 'prompt') { S.ui.prompt = val; }
  persist();
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modalRoot').innerHTML) closeModal(); });

/* the landing pass tilts toward the cursor and floats when left alone */
const reduceMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch { return false; } };
const raf = typeof requestAnimationFrame === 'function' ? requestAnimationFrame : cb => setTimeout(() => cb(Date.now()), 16);
let tiltRunning = false;
/* runs only while the landing pass is on screen, so it costs nothing elsewhere */
function startTilt() {
  if (tiltRunning) return;
  tiltRunning = true;
  const step = () => {
    const card = document.getElementById('passCard');
    if (!card) { tiltRunning = false; return; }          // left the landing page
    curX += (tiltX - curX) * 0.09;
    curY += (tiltY - curY) * 0.09;
    card.style.setProperty('--ry', (curX * 11).toFixed(2) + 'deg');
    card.style.setProperty('--rx', (-curY * 8.5).toFixed(2) + 'deg');
    card.style.setProperty('--mx', (50 + curX * 26).toFixed(1) + '%');
    card.style.setProperty('--my', (50 + curY * 26).toFixed(1) + '%');
    const sh = document.getElementById('passShadow');
    if (sh) sh.style.transform = `translateX(-50%) translateX(${(curX * 14).toFixed(1)}px) scaleX(${(1 - Math.abs(curX) * 0.1).toFixed(3)})`;
    raf(step);
  };
  raf(step);
}
let tiltX = 0, tiltY = 0, curX = 0, curY = 0;
document.addEventListener('pointermove', e => {
  const stage = document.getElementById('stage');
  if (!stage || reduceMotion()) return;
  const r = stage.getBoundingClientRect();
  tiltX = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / (r.width / 2)));
  tiltY = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / (r.height / 2)));
}, { passive: true });
window.addEventListener('mouseout', e => { if (!e.relatedTarget) { tiltX = 0; tiltY = 0; } });
startTilt();
window.addEventListener('hashchange', () => { closeModal(); S.ui.acctOpen = false; render(); });

/* ── boot ───────────────────────────────────────────────────────────────── */
applyTheme(store.get(THEME_KEY) === 'dark' ? 'dark' : 'light');
if (!location.hash) location.replace('#/');
render();
</script>
</body>
